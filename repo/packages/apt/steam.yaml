name: steam
description: Steam gaming platform
type: apt
category: gaming
install:
  packages:
    - steam-installer
    - steam-devices
    - steam-libs
    - steam-libs-i386
    - libgtk2.0-0t64
    - libgtk2.0-0t64:i386
  configs:
    /etc/modules-load.d/10-steam.conf: |
      ntsync
remove:
  packages:
    - steam-installer
    - steam-devices
    - steam-libs
    - steam-libs-i386
