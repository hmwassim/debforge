name: config-gaming
description: Gaming-specific system tuning (split-lock mitigation off)
type: config
category: config
install:
  configs:
    /etc/sysctl.d/99-debforge-gaming.conf: 99-debforge-gaming.conf
post_install: sysctl -w kernel.split_lock_mitigate=0
post_remove: sysctl -w kernel.split_lock_mitigate=1
