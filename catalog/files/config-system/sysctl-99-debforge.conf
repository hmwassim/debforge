# Managed by debforge (config-system). Edits are kept; upstream changes then
# arrive as 99-debforge.conf.debforge-new.

# Virtual memory. Swap tuning (swappiness, page-cluster) belongs to zram and
# is managed by the setup profile's zram step.
vm.vfs_cache_pressure = 50
# Writeback limits scale with RAM (about 1.6/6.4 GiB on 32 GiB). Fixed small
# limits (256 MiB) throttle every large writer (apt, game downloads, builds)
# and make the desktop feel sluggish.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 20
vm.dirty_writeback_centisecs = 1500

# Kernel and responsiveness
kernel.sched_autogroup_enabled = 1
kernel.nmi_watchdog = 0          # with 60-watchdog-blacklist.conf: no watchdogs on desktops
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2

# Network backlog and TCP
net.core.netdev_max_backlog = 16384
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# File watchers (IDEs, sync tools). fs.file-max is not set: systemd already
# raises it to the maximum at boot.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 4096

# Wine/Proton compatibility (SteamOS value; Debian ships 1048576)
vm.max_map_count = 2147483642
