# Managed by debforge (config-system). Edits are kept; upstream changes then
# arrive as 99-debforge.conf.debforge-new.

# Virtual memory, tuned for zram swap (setup always configures zram; the zram
# udev rule raises swappiness to 150 once zram0 is up).
vm.swappiness = 100
vm.vfs_cache_pressure = 50
# Fixed writeback limits (CachyOS defaults) instead of RAM-percentage ratios,
# so large-RAM machines don't accumulate gigabytes of dirty pages.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
vm.page-cluster = 0

# Kernel and responsiveness
kernel.sched_autogroup_enabled = 1
kernel.nmi_watchdog = 0
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2

# Network backlog and TCP
net.core.netdev_max_backlog = 16384
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# File handles and watchers (IDEs, sync tools)
fs.file-max = 9223372036854775807
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 4096

# Wine/Proton compatibility
vm.max_map_count = 2147483642
