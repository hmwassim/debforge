# Sample rates PipeWire may switch to, so 44.1 kHz music plays without
# resampling. The buffer sizes (quantum) keep their defaults: a fixed
# minimum stops PipeWire from using larger buffers when nothing needs low
# latency, which costs battery.
context.properties = {
    default.clock.rate           = 48000
    default.clock.allowed-rates  = [ 44100 48000 96000 ]
}
