# Wine audio: raise the minimum pulse quantum so Wine's 44100/48000 streams
# don't underrun. Playback latency is less critical than dropouts for games.
# Matches both the 64-bit and 32-bit Wine preloaders, since plenty of games
# still ship 32-bit builds.
pulse.rules = [
    {
        matches = [
            { application.process.binary = "wine64-preloader" }
            { application.process.binary = "wine-preloader" }
        ]
        actions = {
            update-props = {
                pulse.min.quantum = 1024/48000
            }
        }
    }
]