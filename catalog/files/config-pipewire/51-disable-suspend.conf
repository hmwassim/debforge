# Outputs never suspend, so HDMI/DP sound isn't cut off at the start and USB
# audio doesn't pop. Microphones keep the default and are released when idle.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
