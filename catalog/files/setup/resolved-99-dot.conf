# Managed by debforge setup.
# Encrypted DNS when the network allows it, plain DNS otherwise, so captive
# portals and networks that block port 853 keep working. Per-link DNS from
# VPNs and the LAN is still used for their own domains.
[Resolve]
DNS=1.1.1.2#security.cloudflare-dns.com 1.0.0.2#security.cloudflare-dns.com 2606:4700:4700::1112#security.cloudflare-dns.com 2606:4700:4700::1002#security.cloudflare-dns.com
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
MulticastDNS=no
Cache=yes
