<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by debforge setup. Missing Microsoft fonts already map to their
     metric-compatible stand-ins: Croscore, Carlito, Caladea (30-metric-aliases.conf). -->
<fontconfig>
  <!-- Noto Nastaliq Urdu covers Arabic but is Urdu calligraphy. -->
  <selectfont>
    <rejectfont>
      <glob>*NotoNastaliq*</glob>
    </rejectfont>
  </selectfont>

  <!-- Other scripts use Noto instead of FreeFont, DejaVu or Lohit. Arabic
       stays with Vazirmatn, which follows Arimo and Tinos. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Arimo</family> <family>Noto Sans Armenian</family> <family>Noto Sans Georgian</family>
      <family>Noto Sans Devanagari</family> <family>Noto Sans Bengali</family>
      <family>Noto Sans Gujarati</family> <family>Noto Sans Gurmukhi</family>
      <family>Noto Sans Kannada</family> <family>Noto Sans Malayalam</family>
      <family>Noto Sans Oriya</family> <family>Noto Sans Tamil</family>
      <family>Noto Sans Telugu</family> <family>Noto Sans Sinhala</family>
      <family>Noto Sans Ethiopic</family> <family>Noto Sans Cherokee</family>
      <family>Noto Sans Thai</family> <family>Noto Sans Lao</family>
      <family>Noto Sans Khmer</family> <family>Noto Sans Myanmar</family>
      <family>Noto Sans Tifinagh</family> <family>Noto Sans Syriac</family>
      <family>Noto Sans Thaana</family> <family>Noto Sans Canadian Aboriginal</family>
      <family>Noto Sans Mongolian</family> <family>Noto Sans Yi</family>
      <family>Noto Sans NKo</family> <family>Noto Sans Adlam</family>
      <family>Noto Sans Javanese</family> <family>Noto Sans Balinese</family>
      <family>Noto Sans Sundanese</family> <family>Noto Sans Ol Chiki</family>
      <family>Noto Sans Vai</family> <family>Noto Sans Tai Viet</family>
      <family>Noto Sans Lisu</family> <family>Noto Sans Bamum</family>
      <family>Noto Sans Osage</family> <family>Noto Sans Tai Le</family>
      <family>Noto Sans New Tai Lue</family> <family>Noto Sans Tai Tham</family>
      <family>Noto Sans Cham</family> <family>Noto Sans Meetei Mayek</family>
      <family>Noto Sans Chakma</family> <family>Noto Sans Batak</family>
      <family>Noto Sans Buginese</family> <family>Noto Sans Tagalog</family>
      <family>Noto Sans Hanifi Rohingya</family> <family>Noto Serif Tibetan</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Tinos</family> <family>Noto Serif Armenian</family>
      <family>Noto Serif Georgian</family> <family>Noto Serif Devanagari</family>
      <family>Noto Serif Bengali</family> <family>Noto Serif Gujarati</family>
      <family>Noto Serif Gurmukhi</family> <family>Noto Serif Kannada</family>
      <family>Noto Serif Malayalam</family> <family>Noto Sans Oriya</family>
      <family>Noto Serif Tamil</family> <family>Noto Serif Telugu</family>
      <family>Noto Serif Sinhala</family> <family>Noto Serif Ethiopic</family>
      <family>Noto Sans Cherokee</family> <family>Noto Serif Thai</family>
      <family>Noto Serif Lao</family> <family>Noto Serif Khmer</family>
      <family>Noto Serif Myanmar</family> <family>Noto Serif Tibetan</family>
      <family>Noto Sans Tifinagh</family> <family>Noto Sans Syriac</family>
      <family>Noto Sans Thaana</family> <family>Noto Sans Canadian Aboriginal</family>
      <family>Noto Sans Mongolian</family> <family>Noto Sans Yi</family>
      <family>Noto Sans NKo</family> <family>Noto Sans Adlam</family>
      <family>Noto Sans Javanese</family> <family>Noto Serif Balinese</family>
      <family>Noto Sans Sundanese</family> <family>Noto Sans Ol Chiki</family>
      <family>Noto Sans Vai</family> <family>Noto Sans Tai Viet</family>
      <family>Noto Sans Lisu</family> <family>Noto Sans Bamum</family>
      <family>Noto Sans Osage</family> <family>Noto Sans Tai Le</family>
      <family>Noto Sans New Tai Lue</family> <family>Noto Sans Tai Tham</family>
      <family>Noto Sans Cham</family> <family>Noto Sans Meetei Mayek</family>
      <family>Noto Sans Chakma</family> <family>Noto Sans Batak</family>
      <family>Noto Sans Buginese</family> <family>Noto Sans Tagalog</family>
      <family>Noto Sans Hanifi Rohingya</family>
    </prefer>
  </alias>
  <alias><family>Sans</family><prefer><family>Arimo</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Cousine</family></prefer></alias>

  <!-- These have no Arabic: Vazirmatn follows them. It has Latin too, so it
       also wins over DejaVu Sans for Arabic in English text. -->
  <alias binding="same"><family>Arimo</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Tinos</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Carlito</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Caladea</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Noto Sans</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Inter</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Noto Serif</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Adwaita Sans</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Cantarell</family><accept><family>Vazirmatn</family></accept></alias>

  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
</fontconfig>
