# Managed by debforge setup (zram step).
# Swap-in reads from zram are cheap and not sequential, so read one page at a
# time instead of the default 8. Swappiness is not set here: the zram udev
# rule (97-zram.rules) raises it to 150 once zram0 is active, and a static
# value would be reset back by every "sysctl --system" run.
vm.page-cluster = 0
