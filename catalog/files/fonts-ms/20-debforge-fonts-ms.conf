<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by debforge (fonts-ms). -->
<fontconfig>
  <!-- Debian's Arial, Times New Roman and Courier New have small Arabic:
       the Windows fonts or their Croscore equivalents are used instead. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/msttcorefonts/Arial.ttf</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/Arial_Bold*.ttf</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/Arial_Italic.ttf</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/arial*.ttf</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/Times_New_Roman*.ttf</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/times*.ttf</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/Courier_New*.ttf</glob>
      <glob>/usr/share/fonts/truetype/msttcorefonts/cour*.ttf</glob>
    </rejectfont>
  </selectfont>

  <!-- Aptos Display also calls itself Aptos, so plain Aptos could pick it. -->
  <match target="scan">
    <test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign_replace"><string>Aptos Display</string></edit>
  </match>

  <!-- Arabic missing from the Windows fonts and their stand-ins (Arimo, Tinos,
       Carlito) comes from Vazirmatn. -->
  <alias binding="same"><family>Arimo</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Tinos</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Carlito</family><accept><family>Vazirmatn</family></accept></alias>
</fontconfig>
