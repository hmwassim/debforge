# The default debforge setup profile. Steps run in order; each one is
# checked first and only applied when something is missing. Files are
# tracked with the same 3-way merge as package files.
steps:
  - id: sources
    title: Package repositories (contrib, non-free, backports)
    builtin: sources

  - id: i386
    title: i386 multiarch (Steam, Wine)
    builtin: i386

  - id: upgrade
    title: System upgrade
    builtin: upgrade

  # From backports to match the kernel, for common desktop and laptop hardware;
  # firmware-sof-signed is not in backports and stays on stable.
  - id: firmware
    title: Firmware (from backports)
    backports: true
    packages:
      - firmware-linux
      - firmware-linux-nonfree
      - firmware-misc-nonfree
      - firmware-amd-graphics
      - firmware-intel-graphics
      - firmware-intel-misc
      - firmware-intel-sound
      - firmware-nvidia-graphics
      - firmware-iwlwifi
      - firmware-realtek
      - firmware-mediatek
      - firmware-atheros
      - firmware-brcm80211
      - firmware-cirrus
      - firmware-sof-signed

  - id: microcode-intel
    title: Intel CPU microcode
    when: {cpu_vendor: intel}
    packages: [intel-microcode]

  - id: microcode-amd
    title: AMD CPU microcode
    when: {cpu_vendor: amd}
    packages: [amd64-microcode]

  # Build tools and headers are in the tools-dev package.
  - id: devtools
    title: Core tools
    packages:
      - git
      - curl
      - wget
      - unzip
      - p7zip-full
      - gnupg
      - jq
      - vim
      - tree
      - pciutils
      - usbutils
      - lm-sensors
      - smartmontools
      - nvme-cli
      - inxi
      - ddcutil
      - gdisk
      - inotify-tools
      - bind9-dnsutils
      - libarchive-tools
      - lz4
      - brotli
      - attr
      - rfkill
      - ncal
      - libnotify-bin
      - hunspell-en-us
      - hunspell-fr

  - id: kernel
    title: Kernel (from backports)
    backports: true
    packages: [linux-image-amd64, linux-headers-amd64]

  # Proton and Wine 11+ use ntsync when /dev/ntsync exists; the driver has no
  # module alias, so nothing else loads it. Stock trixie kernels lack it.
  - id: ntsync
    title: ntsync driver (Proton, Wine 11+)
    files:
      - {dest: /etc/modules-load.d/ntsync.conf, content: "ntsync\n"}
    commands:
      - check: test -e /dev/ntsync || ! /usr/sbin/modinfo ntsync >/dev/null 2>&1
        apply: modprobe ntsync

  - id: zram
    title: zram swap
    packages: [systemd-zram-generator]
    files:
      - {dest: /etc/systemd/zram-generator.conf, src: zram-generator.conf}
      - {dest: /etc/sysctl.d/98-debforge-zram.conf, src: sysctl-98-zram.conf}
    reload: [sysctl]
    # A zram device in use can't be reconfigured: never restart it. Swap being
    # listed in /proc/swaps is the truth; if it isn't, start the swap unit
    # (which pulls in systemd-zram-setup@zram0.service), as zram-generator
    # documents. Config changes take effect at the next boot.
    commands:
      - check: grep -q '^/dev/zram0 ' /proc/swaps
        apply: systemctl daemon-reload && systemctl start dev-zram0.swap
    notes:
      changed: zram settings changed; they take effect after the next reboot.

  # The desktop's power profiles drive tuned through tuned-ppd, which
  # replaces power-profiles-daemon; Performance = throughput-performance.
  - id: tuned
    title: Power profiles (tuned)
    packages: [tuned, tuned-ppd]
    services:
      - {name: tuned.service, enable: true, start: true}
      - {name: tuned-ppd.service, enable: true, start: true}

  - id: timesyncd
    title: Network time sync
    packages: [systemd-timesyncd]
    files:
      - {dest: /etc/systemd/timesyncd.conf.d/10-timesyncd.conf, src: timesyncd.conf}
    services:
      - {name: systemd-timesyncd.service, enable: true, start: true, restart_on_change: true}
    commands:
      - check: test "$(timedatectl show -p NTP --value)" = yes
        apply: timedatectl set-ntp true

  - id: resolved
    title: Encrypted DNS (systemd-resolved, DNS-over-TLS)
    packages: [systemd-resolved]
    files:
      - {dest: /etc/systemd/resolved.conf.d/99-dot.conf, src: resolved-99-dot.conf, when: {chassis: desktop}}
      - {dest: /etc/systemd/resolved.conf.d/99-dot.conf, src: resolved-99-dot-laptop.conf, when: {chassis: laptop}}
    services:
      - {name: systemd-resolved.service, enable: true, start: true, restart_on_change: true}
    commands:
      - check: test "$(readlink /etc/resolv.conf)" = /run/systemd/resolve/stub-resolv.conf
        apply: ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
    verify: resolvectl query one.one.one.one >/dev/null

  - id: resolved-networkmanager
    title: NetworkManager uses systemd-resolved
    when: {network_manager: true}
    files:
      - {dest: /etc/NetworkManager/conf.d/10-dns.conf, src: nm-10-dns.conf}
    services:
      - {name: NetworkManager.service, reload_on_change: true}

  # Login pages of hotel and airport Wi-Fi only open when NetworkManager
  # checks connectivity, which matters more with encrypted DNS.
  - id: connectivity
    title: Captive portal detection
    when: {chassis: laptop, network_manager: true}
    # The package reloads NetworkManager itself.
    packages: [network-manager-config-connectivity-debian]

  - id: gpu-switching
    title: GPU switching (launch apps on the dedicated GPU)
    when: {chassis: laptop}
    packages: [switcheroo-control]
    services:
      - {name: switcheroo-control.service, enable: true, start: true}

  - id: extrepo
    title: extrepo (third-party repositories)
    packages: [extrepo]
    files:
      - {dest: /etc/extrepo/config.yaml, src: extrepo-config.yaml}

  # Newer drivers for current GPUs; backports builds both architectures at
  # the same version. The desktop loads Mesa on NVIDIA systems too.
  - id: mesa
    title: Mesa GPU drivers (from backports)
    backports: true
    packages:
      - mesa-va-drivers
      - mesa-va-drivers:i386
      - mesa-vulkan-drivers
      - mesa-vulkan-drivers:i386
      - libglx-mesa0
      - libglx-mesa0:i386
      - libgl1-mesa-dri
      - libgl1-mesa-dri:i386

  - id: graphics
    title: Video acceleration and Vulkan
    packages:
      - intel-media-va-driver-non-free
      - intel-media-va-driver-non-free:i386
      - libva2
      - libva2:i386
      - libvulkan1
      - libvulkan1:i386
      - vulkan-tools
      - vainfo
      - vdpauinfo

  # PipeWire stays on stable: backports has no matching i386 build, and
  # the 64-bit and 32-bit packages must have the same version. Effects,
  # media tools and game runtime libraries are separate packages
  # (audio-effects, tools-media, tools-gaming).
  - id: multimedia
    title: Multimedia stack (PipeWire, codecs, players)
    packages:
      - pipewire
      - pipewire:i386
      - pipewire-audio
      - pipewire-pulse
      - pipewire-alsa
      - pipewire-jack
      - pipewire-v4l2
      - wireplumber
      - libpipewire-0.3-0t64:i386
      - libspa-0.2-bluetooth
      - libspa-0.2-jack
      - libspa-0.2-modules:i386
      - libasound2-plugins
      - libasound2-plugins:i386
      - rtkit
      - alsa-utils
      - gstreamer1.0-pipewire
      - ffmpeg
      - gstreamer1.0-libav
      - gstreamer1.0-libav:i386
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-good:i386
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-bad:i386
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-plugins-ugly:i386
      - gstreamer1.0-vaapi
      - gstreamer1.0-alsa
      - mpv
      - vlc
      - libheif-plugin-ffmpegdec
      - libheif-plugin-jpegdec
      - libheif-plugin-jpegenc
      - libheif-plugin-rav1e

  # local.conf: generic families use croscore, Noto for other scripts and
  # Vazirmatn for Arabic. Microsoft fonts are the fonts-ms package.
  - id: fonts
    title: Fonts
    packages:
      - fonts-croscore
      - fonts-crosextra-carlito
      - fonts-crosextra-caladea
      - fonts-noto-core
      - fonts-noto-ui-core
      - fonts-noto-mono
      - fonts-noto-cjk
      - fonts-noto-color-emoji
      - fonts-liberation2
      - fonts-inter
      - fonts-vazirmatn-variable
    files:
      - {dest: /etc/fonts/local.conf, src: fonts-local.conf}
    reload: [fontconfig]

  - id: desktop
    title: Desktop tools, VPN plugins and Flatpak
    packages: [fastfetch, papirus-icon-theme, flatpak, xdg-desktop-portal, network-manager-openvpn, network-manager-openconnect]
    commands:
      - check: flatpak remotes --system --columns=name | grep -qx flathub
        apply: flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

  - id: desktop-kde
    title: KDE Flatpak integration
    when: {desktop: kde}
    packages: [plasma-discover-backend-flatpak, xdg-desktop-portal-kde]

  - id: desktop-gnome
    title: GNOME Flatpak integration
    when: {desktop: gnome}
    packages: [gnome-software-plugin-flatpak, xdg-desktop-portal-gnome]
