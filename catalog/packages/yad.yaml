name: yad
description: YAD dialog toolkit (upstream release, built from source)
category: utils
requires: [build-essential, autoconf, automake, libtool, pkg-config, intltool, gettext, libgtk-3-dev, libwebkit2gtk-4.1-dev, libgspell-1-dev, libgtksourceview-3.0-dev]
trust: upstream-tls
version: {from: git-tags, repo: "https://github.com/v1cont/yad", tag: "v{version}"}
source:
  archive:
    url: https://github.com/v1cont/yad/releases/download/v{version}/yad-{version}.tar.xz
    strip: 1
reload: [desktop]
hooks:
  build: |
    ./configure --prefix=/usr/local
    make -j"$(nproc)"
  install: make install DESTDIR="$DESTDIR"
  post_install: glib-compile-schemas /usr/local/share/glib-2.0/schemas 2>/dev/null || true
