name: config-system
description: System tuning (memory, storage, kernel, systemd), CachyOS-aligned
category: system
requires: [hdparm]
files:
  - {dest: /etc/sysctl.d/99-debforge.conf, src: sysctl-99-debforge.conf}
  - {dest: /etc/systemd/system.conf.d/00-timeout.conf, src: systemd-00-timeout.conf}
  - {dest: /etc/systemd/system.conf.d/10-limits.conf, src: systemd-10-limits.conf}
  - {dest: /etc/systemd/user.conf.d/10-limits.conf, src: user-10-limits.conf}
  - {dest: /etc/systemd/journald.conf.d/00-journal-size.conf, src: journald-00-size.conf}
  - {dest: /etc/modules-load.d/storage-schedulers.conf, src: modules-load-storage.conf}
  - {dest: /etc/udev/rules.d/60-scheduler.rules, src: udev-60-scheduler.rules}
  - {dest: /etc/udev/rules.d/69-hdparm.rules, src: udev-69-hdparm.rules}
  - {dest: /etc/udev/rules.d/75-powercap.rules, src: udev-75-powercap.rules}
  - {dest: /etc/udev/rules.d/50-sata.rules, src: udev-50-sata.rules}
  - {dest: /etc/tmpfiles.d/thp.conf, src: tmpfiles-thp.conf}
  - {dest: /etc/tmpfiles.d/thp-shrinker.conf, src: tmpfiles-thp-shrinker.conf}
  - {dest: /etc/modprobe.d/60-watchdog-blacklist.conf, src: modprobe-watchdog-blacklist.conf}
  - {dest: "/etc/systemd/system/user@.service.d/delegate.conf", src: systemd-user-delegate.conf}
  - {dest: /etc/systemd/system/rtkit-daemon.service.d/override.conf, src: systemd-rtkit-loglevel.conf}
reload: [modules, systemd, sysctl, tmpfiles, udev]
hooks:
  # system.conf.d (timeouts, limits) needs a manager re-exec, not a reload;
  # user.conf.d applies at the next login. The watchdog blacklist applies
  # after a reboot.
  post_install: |
    systemctl daemon-reexec
    systemctl restart systemd-journald
