name: scx-tools
description: sched_ext scheduler tools
category: system
trust: upstream-tls
version:
  from: cmd
  # scx-bundler releases are tagged with scx's version, and scx-loader can lag
  # behind, so read this package's version from the latest release's assets.
  cmd: >-
    curl -fsSL https://api.github.com/repos/hmwassim/scx-bundler/releases/latest
    | sed -n 's/.*"name": *"scx-tools_\([^"]*\)_amd64\.deb".*/\1/p' | head -n 1
source:
  deb:
    urls:
      - url: "https://github.com/hmwassim/scx-bundler/releases/latest/download/scx-tools_{version}_amd64.deb"
depends: [scx-scheds]
