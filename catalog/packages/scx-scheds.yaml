name: scx-scheds
description: sched_ext scheduler collection (needs the debforge kernel)
category: system
# On Linux 7.2, schedulers only load with debforge-kernel's BTF fix (in 7.3).
depends: [debforge-kernel]
trust: upstream-tls
version:
  from: cmd
  # scx-bundler releases are tagged with scx's version, and scx-loader can lag
  # behind, so read this package's version from the latest release's assets.
  cmd: >-
    curl -fsSL https://api.github.com/repos/hmwassim/scx-bundler/releases/latest
    | sed -n 's/.*"name": *"scx-scheds_\([^"]*\)_amd64\.deb".*/\1/p' | head -n 1
source:
  deb:
    urls:
      - url: "https://github.com/hmwassim/scx-bundler/releases/latest/download/scx-scheds_{version}_amd64.deb"
notes:
  install: schedulers only load on the debforge kernel; reboot into it if it isn't running.
