    packages:
      - lame
      - x264
      - x265
      - opus-tools
      - flac
      - webp
      - mpg123
      - flvmeta
      - giflib-tools
      - alsa-tools
      - alsa-firmware-loaders
      - libcanberra-pulse
      - gstreamer1.0-tools
