name: nvidia
description: NVIDIA GPU drivers with CUDA support
category: system
hardware: {pci_vendor: "10de"}
source:
  apt:
    extrepo: [nvidia-cuda]
    packages: [nvtop]
    backports: [nvidia-vaapi-driver]
    variants:
      open: [nvidia-open]
      proprietary: [cuda-drivers]
# The driver packages already ship runtime power management rules, suspend
# support and the nouveau blacklist.
files:
  - {dest: /etc/modprobe.d/61-nvidia-dynamic-power.conf, src: modprobe-nvidia-dynamic-power.conf, when: {chassis: laptop}}
hooks:
  # The nvidia module is loaded from the initramfs, which needs the option too.
  post_install: |
    if [ -f /etc/modprobe.d/61-nvidia-dynamic-power.conf ]; then
      update-initramfs -u
    fi
notes:
  install: reboot to load the driver with its new options.
