name: nvidia
description: NVIDIA GPU drivers with CUDA support
category: system
hardware: {pci_vendor: "10de"}
source:
  apt:
    extrepo: [nvidia-cuda]
    packages: [nvtop]
    backports: [nvidia-vaapi-driver]
    variants:
      open: [nvidia-open]
      proprietary: [cuda-drivers]
# The driver packages already ship runtime power management rules, suspend
# support and the nouveau blacklist.
# The initramfs hook loads the driver early: loaded late, it can lose the
# race with the display manager, whose X server then hangs while probing.
files:
  - {dest: /etc/initramfs-tools/hooks/debforge-nvidia, src: initramfs-hook-nvidia, mode: "0755"}
  - {dest: /etc/modprobe.d/61-nvidia-dynamic-power.conf, src: modprobe-nvidia-dynamic-power.conf, when: {chassis: laptop}}
hooks:
  post_install: update-initramfs -u -k all
  post_remove: update-initramfs -u -k all
notes:
  install: reboot to load the driver with its new options.
