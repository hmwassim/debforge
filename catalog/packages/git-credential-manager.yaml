name: git-credential-manager
description: Git Credential Manager - secure Git credential helper
category: development
trust: upstream-tls
version: {from: git-tags, repo: "https://github.com/git-ecosystem/git-credential-manager", tag: "v{version}"}
source:
  deb:
    urls:
      - url: "https://github.com/git-ecosystem/git-credential-manager/releases/download/v{version}/gcm-linux-x64-{version}.deb"
requires: [libsecret-1-0]
hooks:
  post_install: |
    runuser -u "$TARGET_USER" -- git-credential-manager configure
    runuser -u "$TARGET_USER" -- git config --global credential.credentialStore secretservice
  pre_remove: |
    runuser -u "$TARGET_USER" -- git-credential-manager unconfigure || true
    runuser -u "$TARGET_USER" -- git config --global --unset credential.credentialStore || true
