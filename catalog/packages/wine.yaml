name: wine
description: Wine Windows compatibility layer (with ntsync on the backports kernel)
category: gaming
source:
  apt:
    packages: [wine, wine32, wine64, libwine, "libwine:i386", fonts-wine, "wine32-preloader:i386", wine64-preloader, wine-binfmt, q4wine, winbind]
files:
  - {dest: /etc/modules-load.d/10-ntsync.conf, content: "ntsync\n"}
  - {dest: /etc/udev/rules.d/99-ntsync.rules, content: "KERNEL==\"ntsync\", MODE=\"0644\"\n"}
  - dest: /etc/fonts/conf.d/30-win32-aliases.conf
    content: |
      <?xml version="1.0"?>
      <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
      <fontconfig>
        <alias binding="same">
          <family>MS Shell Dlg</family>
          <accept><family>Microsoft Sans Serif</family></accept>
          <default><family>sans-serif</family></default>
        </alias>
        <alias binding="same">
          <family>MS Shell Dlg 2</family>
          <accept><family>Tahoma</family></accept>
          <default><family>sans-serif</family></default>
        </alias>
        <alias binding="same">
          <family>MS Sans Serif</family>
          <prefer><family>Microsoft Sans Serif</family></prefer>
          <default><family>sans-serif</family></default>
        </alias>
      </fontconfig>
reload: [udev, fontconfig, modules]
