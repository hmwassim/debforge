name: nvflux
description: NVIDIA GPU clock manager
category: system
depends: [nvidia]
requires: [gcc, make]
version:
  from: cmd
  cmd: git ls-remote https://github.com/hmwassim/NvFlux.git HEAD | cut -c1-12
source:
  git: {repo: "https://github.com/hmwassim/NvFlux.git"}
hooks:
  build: make
  install: make install DESTDIR="$DESTDIR"
  post_install: install -dm755 /var/lib/nvflux
  pre_remove: /usr/local/bin/nvflux auto 2>/dev/null || true
  post_remove: rm -rf /var/lib/nvflux
