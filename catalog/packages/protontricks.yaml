name: protontricks
description: Winetricks wrapper for Proton-enabled games
category: gaming
requires: [python3, python3-pip, python3-setuptools, python3-setuptools-scm, python3-wheel, python3-vdf, python3-pil, winetricks]
trust: upstream-tls
version: {from: git-tags, repo: "https://github.com/Matoking/protontricks", tag: "{version}"}
source:
  archive:
    url: https://github.com/Matoking/protontricks/archive/refs/tags/{version}.tar.gz
    strip: 1
reload: [desktop]
hooks:
  install: |
    SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION" python3 -m pip install --no-deps --no-build-isolation \
      --break-system-packages --root "$DESTDIR" --prefix /usr/local .
    install -Dm644 -t "$DESTDIR/usr/local/share/applications" \
      src/protontricks/data/share/applications/protontricks.desktop \
      src/protontricks/data/share/applications/protontricks-launch.desktop
