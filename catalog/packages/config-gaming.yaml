name: config-gaming
description: Gaming tuning (split-lock mitigation off, memory map limit, CPU power readout)
category: gaming
files:
  - {dest: /etc/sysctl.d/99-debforge-gaming.conf, src: 99-debforge-gaming.conf}
  - {dest: /etc/udev/rules.d/75-powercap.rules, src: udev-75-powercap.rules}
reload: [sysctl, udev, systemd]
# Earlier versions forced the performance power profile with a service;
# the desktop's power settings choose the profile instead. The unit file is
# removed as a dropped file; its enablement link is not tracked.
legacy_cleanup: [/etc/systemd/system/graphical.target.wants/debforge-cpu-performance.service]
notes:
  install: the CPU power readout (MangoHud, powertop) is readable by members of the video group.
  # The kernel's built-in default can't be read back at runtime, so it is
  # not guessed: it returns at boot.
  remove: split-lock mitigation and the memory map limit return to their defaults after a reboot.
