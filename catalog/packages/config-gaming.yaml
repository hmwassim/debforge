name: config-gaming
description: Gaming tuning (split-lock mitigation off, performance power profile)
category: gaming
requires: [power-profiles-daemon]
files:
  - {dest: /etc/sysctl.d/99-debforge-gaming.conf, src: 99-debforge-gaming.conf}
  - {dest: /etc/systemd/system/debforge-cpu-performance.service, src: debforge-cpu-performance.service}
reload: [sysctl, systemd]
hooks:
  post_install: systemctl enable --now debforge-cpu-performance.service
  pre_remove: systemctl disable --now debforge-cpu-performance.service || true
notes:
  # The kernel's built-in default can't be read back at runtime, so it is
  # not guessed: it returns at boot (1 on Debian kernels, 0 on CachyOS ones).
  remove: split-lock mitigation returns to the kernel's default after a reboot.
